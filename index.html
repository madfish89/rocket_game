<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rocket Game</title>
    <style>
        body, html { 
            margin:0; 
            padding:0; 
            overflow:hidden; 
            background:black; 
            touch-action: none;
        }
        canvas { 
            display:block; 
        }
        #mute { 
            position: absolute; 
            top: 12px; 
            right: 12px; 
            z-index: 9999;
            background-color: rgb(7, 2, 64); 
            border: none; 
            padding: 10px 20px; 
            cursor: pointer;
            color: white;
            border-radius: 50px;
            font-size: 14px;
        }
        #mute:hover { 
            background-color: rgb(26, 26, 63); 
        }

        /* Touch controls - only visible on mobile */
        .touch-controls {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            height: 180px;
            pointer-events: none;
            display: none;
            z-index: 1000;
        }

        .touch-btn {
            position: absolute;
            width: 90px;
            height: 90px;
            background: rgba(255,255,255,0.15);
            border: 3px solid rgba(255,255,255,0.6);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
            font-weight: bold;
            pointer-events: all;
            user-select: none;
            backdrop-filter: blur(4px);
        }

        .touch-left  { left: 30px; bottom: 40px; }
        .touch-right { left: 140px; bottom: 40px; }
        .touch-thrust{ right: 40px; bottom: 40px; }
    </style>
</head>
<body>
    <button id="mute">Mute</button>

    <!-- Touch controls -->
    <div class="touch-controls" id="touchControls">
        <div class="touch-btn touch-left"  id="btnLeft">←</div>
        <div class="touch-btn touch-right" id="btnRight">→</div>
        <div class="touch-btn touch-thrust" id="btnThrust">▲<br>THRUST</div>
    </div>

    <script src="rocket_game.js"></script>
</body>
</html>
